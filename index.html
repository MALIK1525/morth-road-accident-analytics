<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoRTH Road Accident Analytics</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<aside class="sidebar">
  <div class="brand">MoRTH Analytics</div>
  <nav id="nav"></nav>
  <div class="side-foot">Source: MoRTH / PIB / Parliament replies<br>2018-2024 verified panel</div>
</aside>
<main>
  <header class="topbar">
    <h1>MoRTH Road Accident Analytics</h1>
    <div class="filters">
      <label>Year <select id="fYear"></select></label>
      <label>State <select id="fState"></select></label>
      <label>Zone <select id="fZone"></select></label>
      <button id="btnRefresh">Refresh</button>
      <label class="auto"><input type="checkbox" id="fAuto"> Auto-refresh 5s</label>
      <span id="updated"></span>
    </div>
  </header>
  <section id="kpis" class="kpis"></section>
  <div id="sections"></div>
</main>
<script src="app.js"></script>
</body>
</html>
